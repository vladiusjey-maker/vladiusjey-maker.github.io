<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CITY RUSH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #87ceeb;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .hud-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            font-weight: 800;
            font-size: 1.2rem;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .coin-icon {
            width: 20px;
            height: 20px;
            background: #ffd700;
            border-radius: 50%;
            border: 2px solid #ffaa00;
            display: inline-block;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 200, 50, 0.85), rgba(255, 100, 50, 0.85));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            transition: opacity 0.3s ease;
            z-index: 20;
        }
        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
            letter-spacing: -2px;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }
        .blink {
            animation: blinker 1.5s linear infinite;
            font-size: 1.2rem;
            color: #fff;
            font-weight: 700;
            text-align: center;
            margin-top: 20px;
        }
        @keyframes blinker {
            50% { opacity: 0.3; }
        }
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #87ceeb;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 20px;
            color: #fff;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .stat-value {
            font-variant-numeric: tabular-nums;
        }
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 1.1rem; }
            .hud-panel { font-size: 0.9rem; padding: 8px 12px; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="loading-screen" id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Загрузка CITY RUSH...</div>
</div>

<div class="ui-layer">
    <div class="hud" id="hud" style="display: none;">
        <div class="hud-panel">
            <span>SCORE</span>
            <span class="stat-value" id="score-display">0</span>
        </div>
        <div class="hud-panel">
            <span class="coin-icon"></span>
            <span class="stat-value" id="coin-display">0</span>
        </div>
        <div class="hud-panel">
            <span class="stat-value" id="speed-display">0</span>
            <span>km/h</span>
        </div>
    </div>

    <div class="overlay" id="start-screen">
        <h1>CITY RUSH</h1>
        <div class="subtitle">Уворачивайся, прыгай, собирай монеты!</div>
        <div class="blink">Нажми ПРОБЕЛ или тапни для старта</div>
    </div>

    <div class="overlay hidden" id="gameover-screen">
        <h1>GAME OVER</h1>
        <div class="subtitle">Счет: <span id="final-score">0</span> | Монеты: <span id="final-coins">0</span></div>
        <div class="blink">Нажми ПРОБЕЛ или тапни для рестарта</div>
    </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

// --- State Management ---
const state = {
    isPlaying: false,
    isGameOver: false,
    score: 0,
    coins: 0,
    speed: 15,
    maxSpeed: 40,
    lane: 0, // -1, 0, 1
    targetLaneX: 0,
    playerBaseY: 0,
    velocityY: 0,
    isJumping: false,
    distance: 0,
    player: null,
    mixer: null,
    action: null,
    segments: [],
    particles: [],
    lastTime: 0
};

const LANE_WIDTH = 3.5;
const SEGMENT_LENGTH = 40;
const SEGMENT_COUNT = 6;
const GRAVITY = -30;
const JUMP_FORCE = 12;

// --- Scene Setup ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 20, 100);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

// --- Lighting ---
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
hemiLight.position.set(0, 50, 0);
scene.add(hemiLight);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff0dd, 1.2);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 100;
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
scene.add(dirLight);
scene.add(dirLight.target);

// --- Texture Generators ---
function createDashedLineTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFF00';
    ctx.fillRect(0, 0, 64, 256);
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1, 4);
    return tex;
}

const dashedLineTex = createDashedLineTexture();

// --- Materials ---
const matAsphalt = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
const matWhiteLine = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
const matYellowLine = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffaa00, emissiveIntensity: 0.6, roughness: 0.5 });
const matCurb = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.7 });
const matSidewalk = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.9 });
const matBuildingBase = new THREE.MeshStandardMaterial({ color: 0xd0c8b8, roughness: 0.8 });
const matWindowEmissive = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: 0x4488ff, emissiveIntensity: 0.8 });
const matObstacleLow = new THREE.MeshStandardMaterial({ color: 0xff8800, roughness: 0.4 });
const matObstacleHigh = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.4 });
const matCoin = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2, emissive: 0xffaa00, emissiveIntensity: 0.4 });
const matLampPole = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.6, roughness: 0.4 });
const matLampLight = new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: 0xffdd44, emissiveIntensity: 1.5 });

// --- Player Setup ---
function setupPlayer() {
    let loadComplete = false;
    
    // ГАРАНТИРОВАННЫЙ ТАЙМАУТ: если через 3 секунды модель не загрузилась, используем фоллбэк
    const timeoutId = setTimeout(() => {
        if (!loadComplete) {
            console.warn("Загрузка модели превысила таймаут. Используем фоллбэк (капсулу).");
            createFallbackPlayer();
            loadComplete = true;
        }
    }, 3000);

    const loader = new GLTFLoader();
    loader.load(
        'player_game.glb',
        (gltf) => {
            if (loadComplete) return;
            clearTimeout(timeoutId);
            loadComplete = true;
            
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const scale = 2.0 / size.y;
            model.scale.setScalar(scale);

            const scaledBox = new THREE.Box3().setFromObject(model);
            state.playerBaseY = -scaledBox.min.y;
            model.position.y = state.playerBaseY;
            model.rotation.y = Math.PI;

            scene.add(model);
            state.player = model;

            state.mixer = new THREE.AnimationMixer(model);
            const clip = gltf.animations.find(a => a.name.toLowerCase().includes('run') || a.name.toLowerCase().includes('walk')) || gltf.animations[0];
            if (clip) {
                state.action = state.mixer.clipAction(clip);
                state.action.play();
            }
            hideLoading();
        },
        undefined,
        (error) => {
            if (loadComplete) return;
            clearTimeout(timeoutId);
            loadComplete = true;
            console.warn("GLTF load failed, using fallback", error);
            createFallbackPlayer();
        }
    );
}

function createFallbackPlayer() {
    if (state.player) return; // Защита от двойного создания
    
    const geo = new THREE.CapsuleGeometry(0.4, 1.2, 4, 8);
    const mat = new THREE.MeshStandardMaterial({ color: 0x3366ff, roughness: 0.3 });
    state.player = new THREE.Mesh(geo, mat);
    state.player.castShadow = true;
    state.player.receiveShadow = true;
    
    const box = new THREE.Box3().setFromObject(state.player);
    state.playerBaseY = -box.min.y;
    state.player.position.set(0, state.playerBaseY, 0);
    state.player.rotation.y = Math.PI;
    
    scene.add(state.player);
    hideLoading();
}

function hideLoading() {
    const loadingScreen = document.getElementById('loading-screen');
    if (loadingScreen) {
        loadingScreen.classList.add('hidden');
    }
}

// --- Environment Generation ---
function createBuilding() {
    const group = new THREE.Group();
    const width = 4 + Math.random() * 6;
    const depth = 4 + Math.random() * 6;
    const height = 10 + Math.random() * 30;
    
    const baseGeo = new THREE.BoxGeometry(width, height, depth);
    const base = new THREE.Mesh(baseGeo, matBuildingBase);
    base.position.y = height / 2;
    base.castShadow = true;
    base.receiveShadow = true;
    group.add(base);

    const floors = Math.floor(height / 4);
    for (let i = 0; i < floors; i++) {
        const winGeo = new THREE.BoxGeometry(width + 0.1, 0.8, depth + 0.1);
        const win = new THREE.Mesh(winGeo, matWindowEmissive);
        win.position.y = 2 + i * 4;
        group.add(win);
    }
    return group;
}

function createStreetLamp(zOffset) {
    const group = new THREE.Group();
    const poleGeo = new THREE.CylinderGeometry(0.1, 0.15, 6, 8);
    const pole = new THREE.Mesh(poleGeo, matLampPole);
    pole.position.y = 3;
    pole.castShadow = true;
    group.add(pole);

    const armGeo = new THREE.CylinderGeometry(0.08, 0.08, 2, 8);
    const arm = new THREE.Mesh(armGeo, matLampPole);
    arm.rotation.z = Math.PI / 2;
    arm.position.set(1, 5.8, 0);
    group.add(arm);

    const bulbGeo = new THREE.SphereGeometry(0.3, 16, 16);
    const bulb = new THREE.Mesh(bulbGeo, matLampLight);
    bulb.position.set(2, 5.8, 0);
    group.add(bulb);

    group.position.z = zOffset;
    return group;
}

function createSegment(zPosition) {
    const group = new THREE.Group();
    group.position.z = zPosition;

    // Asphalt
    const roadGeo = new THREE.PlaneGeometry(12, SEGMENT_LENGTH);
    const road = new THREE.Mesh(roadGeo, matAsphalt);
    road.rotation.x = -Math.PI / 2;
    road.receiveShadow = true;
    group.add(road);

    // White edge lines
    const edgeLineGeo = new THREE.PlaneGeometry(0.3, SEGMENT_LENGTH);
    const leftLine = new THREE.Mesh(edgeLineGeo, matWhiteLine);
    leftLine.rotation.x = -Math.PI / 2;
    leftLine.position.set(-5.85, 0.01, 0);
    group.add(leftLine);

    const rightLine = new THREE.Mesh(edgeLineGeo, matWhiteLine);
    rightLine.rotation.x = -Math.PI / 2;
    rightLine.position.set(5.85, 0.01, 0);
    group.add(rightLine);

    // Yellow dashed lines
    const dashLineGeo = new THREE.PlaneGeometry(0.2, SEGMENT_LENGTH);
    const leftDash = new THREE.Mesh(dashLineGeo, matYellowLine);
    leftDash.rotation.x = -Math.PI / 2;
    leftDash.position.set(-1.75, 0.02, 0);
    leftDash.material.map = dashedLineTex;
    group.add(leftDash);

    const rightDash = new THREE.Mesh(dashLineGeo, matYellowLine);
    rightDash.rotation.x = -Math.PI / 2;
    rightDash.position.set(1.75, 0.02, 0);
    rightDash.material.map = dashedLineTex;
    group.add(rightDash);

    // Curbs and Sidewalks
    const curbGeo = new THREE.BoxGeometry(1, 0.4, SEGMENT_LENGTH);
    const leftCurb = new THREE.Mesh(curbGeo, matCurb);
    leftCurb.position.set(-6.5, 0.2, 0);
    leftCurb.receiveShadow = true;
    group.add(leftCurb);

    const rightCurb = new THREE.Mesh(curbGeo, matCurb);
    rightCurb.position.set(6.5, 0.2, 0);
    rightCurb.receiveShadow = true;
    group.add(rightCurb);

    const sidewalkGeo = new THREE.BoxGeometry(4, 0.5, SEGMENT_LENGTH);
    const leftSidewalk = new THREE.Mesh(sidewalkGeo, matSidewalk);
    leftSidewalk.position.set(-8.5, 0.25, 0);
    leftSidewalk.receiveShadow = true;
    group.add(leftSidewalk);

    const rightSidewalk = new THREE.Mesh(sidewalkGeo, matSidewalk);
    rightSidewalk.position.set(8.5, 0.25, 0);
    rightSidewalk.receiveShadow = true;
    group.add(rightSidewalk);

    // Buildings
    const leftBuilding = createBuilding();
    leftBuilding.position.set(-12, 0, (Math.random() - 0.5) * 20);
    group.add(leftBuilding);

    const rightBuilding = createBuilding();
    rightBuilding.position.set(12, 0, (Math.random() - 0.5) * 20);
    group.add(rightBuilding);

    // Street Lamps
    if (Math.random() > 0.5) {
        const lampLeft = createStreetLamp((Math.random() - 0.5) * 30);
        lampLeft.position.x = -7.5;
        lampLeft.rotation.y = Math.PI / 2;
        group.add(lampLeft);
    }
    if (Math.random() > 0.5) {
        const lampRight = createStreetLamp((Math.random() - 0.5) * 30);
        lampRight.position.x = 7.5;
        lampRight.rotation.y = -Math.PI / 2;
        group.add(lampRight);
    }

    scene.add(group);
    return { mesh: group, z: zPosition, obstacles: [], coins: [] };
}

function spawnObstaclesAndCoins(segment) {
    // Clear old
    segment.obstacles.forEach(o => scene.remove(o.mesh));
    segment.coins.forEach(c => scene.remove(c.mesh));
    segment.obstacles = [];
    segment.coins = [];

    // Randomly choose lanes to populate
    const lanes = [-1, 0, 1].sort(() => Math.random() - 0.5);
    const numObstacles = Math.floor(Math.random() * 2) + 1;
    
    for (let i = 0; i < numObstacles; i++) {
        const lane = lanes[i];
        const isHigh = Math.random() > 0.5;
        const geo = new THREE.BoxGeometry(2, isHigh ? 2.5 : 1, 1);
        const mat = isHigh ? matObstacleHigh : matObstacleLow;
        const mesh = new THREE.Mesh(geo, mat);
        
        mesh.position.set(lane * LANE_WIDTH, isHigh ? 1.25 : 0.5, segment.z + (Math.random() - 0.5) * 20);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        segment.obstacles.push({ mesh, isHigh });
    }

    // Spawn coins in empty lanes
    const coinLane = lanes[numObstacles] !== undefined ? lanes[numObstacles] : 0;
    const coinCount = Math.floor(Math.random() * 3) + 2;
    for (let i = 0; i < coinCount; i++) {
        const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
        const mesh = new THREE.Mesh(geo, matCoin);
        mesh.rotation.x = Math.PI / 2;
        mesh.position.set(coinLane * LANE_WIDTH, 1.0, segment.z + 15 - i * 3);
        mesh.castShadow = true;
        scene.add(mesh);
        segment.coins.push({ mesh, active: true });
    }
}

// Initialize segments
for (let i = 0; i < SEGMENT_COUNT; i++) {
    const z = -i * SEGMENT_LENGTH;
    const seg = createSegment(z);
    if (i > 0) spawnObstaclesAndCoins(seg);
    state.segments.push(seg);
}

// --- Input Handling ---
function handleJump() {
    if (!state.isJumping && state.isPlaying && !state.isGameOver) {
        state.velocityY = JUMP_FORCE;
        state.isJumping = true;
    }
}

function handleLaneChange(direction) {
    if (!state.isPlaying || state.isGameOver) return;
    const newLane = state.lane + direction;
    if (newLane >= -1 && newLane <= 1) {
        state.lane = newLane;
        state.targetLaneX = state.lane * LANE_WIDTH;
    }
}

function startGame() {
    if (state.isGameOver) {
        resetGame();
    }
    state.isPlaying = true;
    state.isGameOver = false;
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('hud').style.display = 'flex';
}

function gameOver() {
    state.isPlaying = false;
    state.isGameOver = true;
    spawnExplosion(state.player.position);
    if (state.action) state.action.stop();
    
    document.getElementById('final-score').textContent = Math.floor(state.score);
    document.getElementById('final-coins').textContent = state.coins;
    document.getElementById('gameover-screen').classList.remove('hidden');
    document.getElementById('hud').style.display = 'none';
}

function resetGame() {
    state.score = 0;
    state.coins = 0;
    state.speed = 15;
    state.lane = 0;
    state.targetLaneX = 0;
    state.distance = 0;
    state.velocityY = 0;
    state.isJumping = false;
    
    if (state.player) {
        state.player.position.set(0, state.playerBaseY, 0);
        state.player.rotation.z = 0;
        if (state.action) state.action.play();
    }
    
    camera.position.set(0, 5, 8);
    
    state.segments.forEach((seg, i) => {
        seg.mesh.position.z = -i * SEGMENT_LENGTH;
        seg.z = -i * SEGMENT_LENGTH;
        if (i > 0) spawnObstaclesAndCoins(seg);
    });
    
    state.particles.forEach(p => scene.remove(p.mesh));
    state.particles = [];
    
    updateUI();
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        if (!state.isPlaying && !state.isGameOver) {
            startGame();
        } else if (state.isGameOver) {
            startGame();
        } else {
            handleJump();
        }
    }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        handleLaneChange(-1);
    }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        handleLaneChange(1);
    }
});

// Touch handling
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

window.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
    touchStartTime = Date.now();
}, { passive: false });

window.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].screenX;
    const touchEndY = e.changedTouches[0].screenY;
    const dx = touchEndX - touchStartX;
    const dy = touchEndY - touchStartY;
    const dt = Date.now() - touchStartTime;

    if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 300) {
        // Tap
        if (!state.isPlaying || state.isGameOver) {
            startGame();
        }
    } else {
        // Swipe
        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 30) handleLaneChange(1);
            else if (dx < -30) handleLaneChange(-1);
        } else {
            if (dy < -30) handleJump();
        }
    }
}, { passive: false });

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Particle System ---
function spawnExplosion(position) {
    for (let i = 0; i < 30; i++) {
        const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff4400, emissiveIntensity: 0.5 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(position);
        mesh.position.x += (Math.random() - 0.5) * 2;
        mesh.position.y += (Math.random() - 0.5) * 2 + 1;
        mesh.position.z += (Math.random() - 0.5) * 2;
        
        const velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 15,
            Math.random() * 15,
            (Math.random() - 0.5) * 15
        );
        state.particles.push({ mesh, velocity, life: 1.0 });
        scene.add(mesh);
    }
}

// --- Game Loop ---
const clock = new THREE.Clock();
const playerBox = new THREE.Box3();
const obsBox = new THREE.Box3();

function updateUI() {
    document.getElementById('score-display').textContent = Math.floor(state.score);
    document.getElementById('coin-display').textContent = state.coins;
    document.getElementById('speed-display').textContent = Math.floor(state.speed * 3.6); // m/s to km/h
}

function animate() {
    requestAnimationFrame(animate);
    
    const delta = Math.min(clock.getDelta(), 0.1);
    
    if (state.mixer && state.isPlaying && !state.isGameOver) {
        state.mixer.update(delta);
    }

    if (state.isPlaying && !state.isGameOver) {
        // Speed increase
        state.speed = Math.min(state.maxSpeed, state.speed + delta * 0.5);
        state.distance += state.speed * delta;
        state.score += state.speed * delta * 0.1;
        
        // Player movement
        state.player.position.x += (state.targetLaneX - state.player.position.x) * 10 * delta;
        state.player.rotation.z = -(state.player.position.x - state.targetLaneX) * 0.15;
        
        // Jump physics
        state.velocityY += GRAVITY * delta;
        state.player.position.y += state.velocityY * delta;
        
        if (state.player.position.y <= state.playerBaseY) {
            state.player.position.y = state.playerBaseY;
            state.velocityY = 0;
            state.isJumping = false;
        }

        // Camera follow
        const targetCamX = state.player.position.x * 0.5;
        camera.position.x += (targetCamX - camera.position.x) * 5 * delta;
        camera.position.z = state.player.position.z + 8;
        camera.position.y = state.player.position.y + 4;
        camera.lookAt(state.player.position.x, state.player.position.y + 1, state.player.position.z - 5);

        // Light follow
        dirLight.position.set(state.player.position.x + 5, state.player.position.y + 15, state.player.position.z + 10);
        dirLight.target = state.player;

        // Segment recycling
        state.segments.forEach(seg => {
            if (seg.z < state.player.position.z - SEGMENT_LENGTH) {
                seg.z += SEGMENT_COUNT * SEGMENT_LENGTH;
                seg.mesh.position.z = seg.z;
                spawnObstaclesAndCoins(seg);
            }
        });

        // Collision Detection
        playerBox.setFromObject(state.player);
        playerBox.expandByScalar(-0.3); // Forgiving hitbox

        let hitObstacle = false;
        state.segments.forEach(seg => {
            seg.obstacles.forEach(obs => {
                obsBox.setFromObject(obs.mesh);
                if (playerBox.intersectsBox(obsBox)) {
                    hitObstacle = true;
                }
            });
            
            seg.coins.forEach(coin => {
                if (coin.active) {
                    coin.mesh.rotation.y += 3 * delta;
                    if (coin.mesh.position.distanceTo(state.player.position) < 1.5) {
                        coin.active = false;
                        coin.mesh.visible = false;
                        state.coins++;
                        state.score += 50;
                    }
                }
            });
        });

        if (hitObstacle) {
            gameOver();
        }

        updateUI();
    }

    // Particles update (always run for visual completion)
    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.life -= delta * 1.5;
        p.velocity.y += GRAVITY * delta;
        p.mesh.position.addScaledVector(p.velocity, delta);
        p.mesh.rotation.x += delta * 5;
        p.mesh.rotation.y += delta * 5;
        p.mesh.scale.setScalar(p.life);
        
        if (p.life <= 0 || p.mesh.position.y < -5) {
            scene.remove(p.mesh);
            state.particles.splice(i, 1);
        }
    }

    renderer.render(scene, camera);
}

// --- Initialization ---
setupPlayer();
animate();

</script>
