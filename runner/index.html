<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CITY RUSH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #87ceeb;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .hud-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            font-weight: 800;
            font-size: 1.2rem;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .coin-icon {
            width: 20px;
            height: 20px;
            background: #ffd700;
            border-radius: 50%;
            border: 2px solid #ffaa00;
            display: inline-block;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 200, 50, 0.85), rgba(255, 100, 50, 0.85));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            transition: opacity 0.3s ease;
            z-index: 20;
        }
        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
            letter-spacing: -2px;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }
        .blink {
            animation: blinker 1.5s linear infinite;
            font-size: 1.2rem;
            color: #fff;
            font-weight: 700;
            text-align: center;
            margin-top: 20px;
        }
        @keyframes blinker {
            50% { opacity: 0.3; }
        }
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #87ceeb;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 20px;
            color: #fff;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .stat-value {
            font-variant-numeric: tabular-nums;
        }
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 1.1rem; }
            .hud-panel { font-size: 0.9rem; padding: 8px 12px; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="loading-screen" id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Загрузка CITY RUSH...</div>
</div>

<div class="ui-layer">
    <div class="hud" id="hud" style="display: none;">
        <div class="hud-panel">
            <span>SCORE</span>
            <span class="stat-value" id="score-display">0</span>
        </div>
        <div class="hud-panel">
            <span class="coin-icon"></span>
            <span class="stat-value" id="coin-display">0</span>
        </div>
        <div class="hud-panel">
            <span class="stat-value" id="speed-display">0</span>
            <span>km/h</span>
